<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b3a4b'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>This dashboard needs JavaScript.</noscript>
<div id="app"></div>
<div id="tip" class="tip" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="frm" class="dlg" autocomplete="off"></form>
</dialog>
<dialog id="cmdk" class="cmdk" aria-label="Search and jump">
  <div class="cmdk-input"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="cmdk-q" type="text" placeholder="Search holdings, jump to a page, run an action…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmdk-list"></div>
  <div class="cmdk-list" id="cmdk-list" role="listbox"></div>
  <div class="cmdk-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span><span><kbd>esc</kbd> to close</span></div>
</dialog>
<datalist id="brokers"></datalist>
<input type="file" id="file" accept="application/json" hidden>
<input type="file" id="csvfile" accept=".csv,.tsv,text/csv,text/plain" hidden>

<script src="vendor/d3.min.js"></script>
<script src="js/palettes.js"></script>
<script src="js/format.js"></script>
<script src="js/icons.js"></script>
<script src="js/calc.js"></script>
<script src="js/csv.js"></script>
<script src="js/charts.js"></script>
<script src="js/views-core.js"></script>
<script src="js/views-overview.js"></script>
<script src="js/views-holdings.js"></script>
<script src="js/views-pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
